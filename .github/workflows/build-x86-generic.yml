
name: Build Usque - OpenWrt 25.12 x86 Generic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'usque/**'
      - 'luci-app-usque/**'
      - '.github/workflows/build-x86-generic.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4

      - name: Checkout upstream Usque source
        uses: actions/checkout@v4
        with:
          repository: Diniboy1123/usque
          ref: v4.2.1
          path: upstream
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: true
          cache-dependency-path: upstream/go.sum

      - name: Build 32-bit Usque executable
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p usque/files

          cd upstream

          go mod download

          GOOS=linux \
          GOARCH=386 \
          GO386=sse2 \
          CGO_ENABLED=0 \
          go build \
            -trimpath \
            -ldflags="-s -w -buildid=" \
            -o "$GITHUB_WORKSPACE/usque/files/usque" .

          cp LICENSE.md "$GITHUB_WORKSPACE/usque/files/LICENSE.md"

          chmod 755 "$GITHUB_WORKSPACE/usque/files/usque"

          file "$GITHUB_WORKSPACE/usque/files/usque"

          readelf -h "$GITHUB_WORKSPACE/usque/files/usque"

          readelf -h "$GITHUB_WORKSPACE/usque/files/usque" \
            | grep -q 'Class:.*ELF32'

          readelf -h "$GITHUB_WORKSPACE/usque/files/usque" \
            | grep -q 'Machine:.*Intel 80386'

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            zstd \
            libelf-dev

      - name: Download OpenWrt 25.12.5 generic SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/generic/openwrt-sdk-25.12.5-x86-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst

          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk

          SDK_DIR="$(find sdk -mindepth 1 -maxdepth 1 -type d | head -n1)"

          echo "SDK_DIR=$GITHUB_WORKSPACE/$SDK_DIR" >> "$GITHUB_ENV"

      - name: Configure local package feed
        shell: bash
        run: |
          set -euxo pipefail

          cd "$SDK_DIR"

          echo "src-link usque $GITHUB_WORKSPACE" >> feeds.conf.default

          ./scripts/feeds update -a

          ./scripts/feeds install -p usque usque
          ./scripts/feeds install -p usque luci-app-usque

          make defconfig

      - name: Compile Usque
        run: |
          cd "$SDK_DIR"
          make package/feeds/usque/usque/compile V=s -j2

      - name: Compile LuCI application
        run: |
          cd "$SDK_DIR"
          make package/feeds/usque/luci-app-usque/compile V=s -j2

      - name: Verify and collect APK packages
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          find "$SDK_DIR/bin/packages" -type f \
            \( -name 'usque-*.apk' \
            -o -name 'luci-app-usque-*.apk' \) \
            -exec cp {} artifacts/ \;

          test "$(find artifacts -maxdepth 1 -name 'usque-*.apk' | wc -l)" -eq 1
          test "$(find artifacts -maxdepth 1 -name 'luci-app-usque-*.apk' | wc -l)" -eq 1

          sha256sum artifacts/*.apk > artifacts/SHA256SUMS

          ls -lh artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usque-openwrt-25.12.5-x86-generic
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
